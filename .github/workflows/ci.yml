name: CI

on:
    pull_request:
        branches:
            - develop
            - main

    push:
        branches:
            - develop

jobs:
    frontend:
        name: Frontend Build
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: frontend

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install dependencies
              run: npm install

            - name: Lint
              run: npm run lint

            - name: Build
              run: npm run build

    backend:
        name: Backend Build
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: backend

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install dependencies
              run: npm install

            - name: Lint
              run: npm run lint

            - name: Run Tests
              run: npm run test

            - name: Build
              run: npm run build
