version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: uptgo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: uptgo
      POSTGRES_PASSWORD: uptgo_dev_password
      POSTGRES_DB: uptgo_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - uptgo_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U uptgo -d uptgo_db']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: uptgo_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@uptgo.local
      PGADMIN_DEFAULT_PASSWORD: pgadmin_dev
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - uptgo_network

volumes:
  postgres_data:

networks:
  uptgo_network:
    driver: bridge
